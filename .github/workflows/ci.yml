name: Backend CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: miru
          POSTGRES_PASSWORD: miru_password
          POSTGRES_DB: miru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miru -d miru_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://miru:miru_password@localhost:5432/miru_test
      JWT_SECRET_KEY: miru-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      JOURNAL_ANALYZER_PROVIDER: keyword
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: llama3.2:1b

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q