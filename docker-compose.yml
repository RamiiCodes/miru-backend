services:
  postgres:
    image: postgres:16
    container_name: miru_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: miru
      POSTGRES_PASSWORD: miru_password
      POSTGRES_DB: miru
    ports:
      - "5432:5432"
    volumes:
      - miru_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miru -d miru"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  miru_postgres_data: